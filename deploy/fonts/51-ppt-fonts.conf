<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    成稿 pptx 里的字体名是 Windows 原生名（Microsoft YaHei / Times New Roman），
    Windows 与 WPS 打开即命中；国产系统（麒麟 / 统信）没有这两款商业字体，
    在这里补 fontconfig 别名，让渲染时落到本机已有的等效字体上。
    容器由 deploy/Dockerfile COPY 到 /etc/fonts/conf.d/ 后 fc-cache -f；
    客户端执行 deploy/install-ppt-fonts-aliases.sh 安装本文件。
  -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
