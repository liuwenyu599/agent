# =============================================================================
# Draw.io MCP 服务（PPT 视觉增强层）
#
# 作用：在 PPT 生成链路里，让「支持 tool-call 的本地模型（35B）」通过工具调用
#       获取 draw.io 语法参考（get_drawio_reference）与形状样式（search_shapes），
#       从而写出规范的 .drawio XML；后端再转换为可编辑 PPTX 形状和连线。
#       官方镜像 jgraph/drawio-mcp 同一套与 https://mcp.draw.io/mcp 一致。
#
# 重要边界（务必先读）：
#   - 本服务只产出「文本型工具结果」（语法参考 / 形状样式字符串），不产出 .pptx。
#     .drawio XML → PPTX 原生对象的转换由后端独立完成（drawio_native.py），
#     不依赖 drawio-mcp。drawio-mcp 的 create_diagram 在非 MCP-Apps 宿主下会把
#     XML/Mermaid 以「文本」形式返回，可作为渲染前的预览/校验，但不是必走路径。
#   - 服务本身无鉴权；内网部署必须靠防火墙 / 反向代理 / 仅绑回环来控制可达范围。
#   - 内网不出网：search_shapes 默认会补查 icons.diagrams.net，设
#     DRAWIO_ICON_SERVICE_URL=off 关闭该出网请求（形状库已内置镜像中）。
#
# 用法：
#   cd deploy/drawio-mcp && docker compose up -d
#   # MCP 端点 = http://<宿主IP>:3001/mcp
#   健康检查：GET http://localhost:3001/health  → 200 ok
#
# 接入后端：在 API 容器的 .env 设 DRAWIO_MCP_URL=http://drawio-mcp:3001/mcp
#   （docker 网络内用服务名；宿主机直连用 http://<宿主IP>:3001/mcp）。
# =============================================================================

services:

  drawio-mcp:
    # 官方镜像，已构建 linux/amd64 与 linux/arm64（生产麒麟 ARM64 走 arm64）
    image: jgraph/drawio-mcp:latest
    container_name: justice-drawio-mcp
    restart: unless-stopped
    platform: linux/arm64

    environment:
      # 容器内监听端口（默认 3001，与镜像默认值一致）
      PORT: "3001"
      # ⚠ 内网不出网：关闭 search_shapes 对 icons.diagrams.net 的补充查询。
      #   形状库本体已内置镜像，关闭后离线可用。
      DRAWIO_ICON_SERVICE_URL: "off"
      # 可选：限制接受的主机名（按 Host 头校验），逗号分隔无空格。
      # 示例：ALLOWED_HOSTS: "drawio-mcp.internal,localhost"
      ALLOWED_HOSTS: ""
      TZ: Asia/Shanghai

    ports:
      # 仅绑回环 = 仅本机可访问；生产若需跨容器访问，交给 docker 网络（服务名）
      # 即可，不必对外发布。需要对外发布时改成 "3001:3001"（全网可达，谨慎）。
      - "127.0.0.1:3001:3001"

    healthcheck:
      # 镜像基于 node，无 curl/wget；用 node 全局 fetch 探活（Node 18+ 自带）。
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - justice-net


networks:
  # 与 deploy/production.docker-compose.yml 的 justice-net 同名，便于跨 compose 互通。
  # 若本 compose 单独 up，docker 会新建一个同名但隔离的网络；跨文件互通请显式
  # external: true 并指向生产已建的网络（见 README）。
  justice-net:
    driver: bridge
